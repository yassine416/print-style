<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRINT Style - الإدارة</title><style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#f4f5f7}.wrap{max-width:1150px;margin:auto;padding:18px}header,.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:18px}header{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.item,.order{border:1px solid #eee;border-radius:14px;padding:15px;background:#fff;margin-top:10px}input,textarea,select{width:100%;padding:12px;margin:5px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}textarea{min-height:80px}button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:800}.primary{background:#111;color:#fff;width:100%;margin-top:8px}.edit{background:#ffd21a}.toggle{background:#198754;color:#fff}.hide{background:#dc3545;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.msg{display:none;padding:10px;border-radius:10px;margin-top:8px}.ok{display:block;background:#eaf8ee;color:#176b3a}.err{display:block;background:#fdeaea;color:#a61b1b}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.total{color:#198754;font-weight:900;font-size:20px}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><h1>👕 PRINT Style</h1><p>لوحة إدارة الطباعة الحرارية</p></header><div class="card"><h2>🚚 سعر التوصيل</h2><input id="fee" type="number" min="0"><button class="primary" onclick="saveFee()">💾 حفظ</button><div id="fm" class="msg"></div></div><div class="card"><h2>➕ إضافة منتج</h2><input id="n" placeholder="اسم المنتج"><select id="c"><option value="tshirts">👕 تيشيرتات</option><option value="hoodies">🧥 هوديز</option><option value="mugs">☕ مجات</option><option value="caps">🧢 كاسكيت</option><option value="bags">👜 حقائب</option></select><input id="p" type="number" min="0" placeholder="السعر"><input id="em" placeholder="الإيموجي"><input id="im" placeholder="رابط الصورة"><textarea id="de" placeholder="الوصف"></textarea><button class="primary" onclick="add()">➕ إضافة</button><div id="m" class="msg"></div></div><div class="card"><h2>🛍️ المنتجات</h2><div id="pro">...</div></div><div class="card"><h2>📦 الطلبات</h2><div id="ord">...</div></div></div><script>const u=prompt('اسم المستخدم:'),p=prompt('كلمة المرور:'),auth='Basic '+btoa((u||'')+':'+(p||''));let products=[],orders=[];async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:auth};const r=await fetch(url,opt),t=await r.text();if(!r.ok)throw Error(t||'خطأ');return t?JSON.parse(t):null}function msg(id,t,ok=1){const x=document.getElementById(id);x.className='msg '+(ok?'ok':'err');x.textContent=t;setTimeout(()=>x.className='msg',2200)}async function load(){const [s,a,b]=await Promise.all([api('/api/admin/settings'),api('/api/admin/products'),api('/api/admin/orders')]);document.getElementById('fee').value=s.deliveryFee;products=a;orders=b;renderProducts();renderOrders()}async function saveFee(){try{await api('/api/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({deliveryFee:Number(document.getElementById('fee').value)})});msg('fm','✅ تم حفظ السعر')}catch(e){msg('fm','❌ '+e.message,0)}}async function add(){const d={name:n.value.trim(),category:c.value,price:Number(p.value),emoji:em.value.trim(),image:im.value.trim(),description:de.value.trim()};try{await api('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});n.value='';p.value='';em.value='';im.value='';de.value='';msg('m','✅ تمت الإضافة');load()}catch(e){msg('m','❌ '+e.message,0)}}function lab(c){return{tshirts:'👕 تيشيرتات',hoodies:'🧥 هوديز',mugs:'☕ مجات',caps:'🧢 كاسكيت',bags:'👜 حقائب'}[c]||c}function renderProducts(){pro.innerHTML='<div class="grid">'+products.map(x=>`<div class="item"><h3>${x.emoji||'👕'} ${esc(x.name)}</h3><p>${lab(x.category)} — ${Number(x.price).toLocaleString('fr-DZ')} دج</p><div class="actions"><button class="edit" onclick="edit(${x.id})">✏️ تعديل</button><button class="${x.active?'hide':'toggle'}" onclick="toggle(${x.id},${x.active?0:1})">${x.active?'👁️ إخفاء':'👁️ إظهار'}</button></div></div>`).join('')+'</div>'}async function edit(id){const x=products.find(a=>a.id===id);if(!x)return;const name=prompt('الاسم',x.name),price=prompt('السعر',x.price);if(!name||price===null)return;await api('/api/admin/products/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...x,name,price:Number(price)})});load()}async function toggle(id,active){const x=products.find(a=>a.id===id);await api('/api/admin/products/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...x,active})});load()}function renderOrders(){const L={new:'🆕 جديد',preparing:'👨‍🍳 تحضير',printing:'🖨️ طباعة',ready:'✅ جاهز',delivering:'🚚 توصيل',done:'✅ مكتمل',cancelled:'❌ ملغى'};ord.innerHTML=orders.length?orders.map(o=>{let it=[];try{it=typeof o.items==='string'?JSON.parse(o.items):o.items||[]}catch{};let cu={};try{cu=typeof o.customization==='string'?JSON.parse(o.customization):o.customization||{}}catch{};return `<div class="order"><h3>📦 طلب #${o.id}</h3><p>👤 ${esc(o.name||'')}</p><p>📞 ${esc(o.phone||'')}</p><p>📍 ${esc(o.address||'')}</p><p>📏 ${esc(cu.size||'—')} | 🎨 ${esc(cu.color||'—')} | 🖨️ ${esc(cu.printPosition||'—')}</p><div>${it.map(i=>`<div>${i.emoji||'👕'} ${esc(i.name)} × ${i.quantity}</div>`).join('')}</div><p>🛒 المنتجات: ${Number(o.subtotal||0).toLocaleString('fr-DZ')} دج</p><p>🚚 التوصيل: ${Number(o.delivery_fee||0).toLocaleString('fr-DZ')} دج</p><div class="total">💰 ${Number(o.total||0).toLocaleString('fr-DZ')} دج</div><select onchange="status(${o.id},this.value)">${Object.keys(L).map(s=>`<option value="${s}" ${s==o.status?'selected':''}>${L[s]}</option>`).join('')}</select></div>`}).join(''):'📭 لا توجد طلبات'}async function status(id,s){await api('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});load()}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}load();</script></body></html>
